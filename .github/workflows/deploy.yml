name: Deploy Fazl Admin Backend - Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            APP_DIR="/var/www/buy-sell/production/admin/backend"

            echo "======================================"
            echo "FAZL ADMIN BACKEND DEPLOYMENT"
            echo "======================================"

            cd "$APP_DIR"

            echo "Fetching main branch..."
            git fetch origin main

            echo "Updating production code..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Creating production build..."
            npm run build

            echo "Production build successful."

            echo "Restarting backend..."
            pm2 restart buy-sell-admin-api --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."
            curl -f http://127.0.0.1:3003/ > /dev/null

            echo "======================================"
            echo "BACKEND DEPLOYMENT SUCCESSFUL"
            echo "https://api.fazl.io"
            echo "======================================"
