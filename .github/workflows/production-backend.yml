name: Deploy Fazl Production Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Production Backend Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            APP_DIR="/var/www/buy-sell/production/backend"

            echo "======================================"
            echo "FAZL PRODUCTION BACKEND DEPLOYMENT"
            echo "======================================"

            cd "$APP_DIR"

            echo "Fetching main branch..."
            git fetch origin main

            echo "Updating production code..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            # Applies any pending Prisma migrations BEFORE the new code starts,
            # so the app never boots against an un-migrated database. Safe to
            # run on every deploy: already-applied migrations are a no-op.
            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Creating production build..."
            npm run build

            echo "Production build successful."

            echo "Restarting backend..."
            pm2 restart buy-sell-production-api --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."
            curl -f http://127.0.0.1:3000/ > /dev/null

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "API: https://api.fazlapp.com"
            echo "======================================"
